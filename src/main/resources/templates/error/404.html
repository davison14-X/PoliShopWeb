<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      class="h-full bg-slate-50">

<head th:replace="~{layout/base :: head('Página no encontrada', 'La página que buscas no existe en PoliShop.')}"></head>

<body class="min-h-full flex flex-col text-slate-900 bg-slate-50 antialiased">

<div th:replace="~{layout/base :: navbar}"></div>

<main class="flex-1 flex items-center justify-center px-4 py-16">
    <div class="text-center max-w-md">

        <!-- Número 404 grande -->
        <div class="text-8xl sm:text-9xl font-black text-slate-200 leading-none select-none mb-2">
            404
        </div>

        <!-- Ícono -->
        <div class="w-16 h-16 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center mx-auto mb-5">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>

        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-2">
            Página no encontrada
        </h1>
        <p class="text-sm sm:text-base text-slate-500 leading-relaxed mb-8">
            El emprendimiento, producto o página que buscas no existe o fue removido del catálogo de PoliShop.
        </p>

        <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
            <a th:href="@{/}"
               class="px-5 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-semibold text-sm transition-colors shadow-sm flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                Ir al catálogo
            </a>
            <button onclick="history.back()"
                    class="px-5 py-2.5 rounded-xl border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium text-sm transition-colors cursor-pointer">
                Volver atrás
            </button>
        </div>

    </div>
</main>

<div th:replace="~{layout/base :: bottomNav}"></div>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
