<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      class="h-full">
<head th:fragment="head(titulo, descripcion)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title th:text="${titulo} + ' — PoliShop PCJIC'">PoliShop — Marketplace Comunidad PCJIC</title>

    <link rel="icon" type="image/png" th:href="@{/img/logo_polishop_texto.png}" />

    <meta name="description" th:content="${descripcion}?: 'Plataforma de emprendimientos y comercio de la comunidad del Politécnico Colombiano Jaime Isaza Cadavid.'" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
              colors: {
                emerald: {
                  50:'#ecfdf5', 100:'#d1fae5', 200:'#a7f3d0', 300:'#6ee7b7',
                  400:'#34d399', 500:'#10b981', 600:'#059669', 700:'#047857',
                  800:'#065f46', 900:'#064e3b', 950:'#022c22'
                },
                slate: {
                  50:'#f8fafc', 100:'#f1f5f9', 200:'#e2e8f0', 300:'#cbd5e1',
                  400:'#94a3b8', 500:'#64748b', 600:'#475569', 700:'#334155',
                  800:'#1e293b', 900:'#0f172a', 950:'#020617'
                }
              }
            }
          }
        }
    </script>

    <link rel="stylesheet" th:href="@{/css/styles.css}" />

    <!-- Inicializar tema antes del render para evitar flash -->
    <script>
      (function(){
        var t = localStorage.getItem('polishop-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>

    <th:block th:replace="${extraHead} ?: ~{}" />
</head>

<body class="min-h-full flex flex-col antialiased" style="background-color: var(--color-bg); color: var(--color-text);">

<!-- ============================================================ -->
<!-- FRAGMENTO: NAVBAR                                            -->
<!-- ============================================================ -->
<header th:fragment="navbar" class="ps-navbar sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">

        <!-- Logo -->
        <a th:href="@{/}" class="flex items-center gap-2.5 group cursor-pointer">
            <img th:src="@{/img/logo_polishop_sin_texto.png}" alt="PoliShop" class="w-9 h-9 rounded-xl shadow-sm object-contain" />
            <div class="flex items-baseline gap-1.5">
                <span class="text-xl font-black tracking-tight" style="color: var(--color-text);">Poli<span style="color: var(--color-primary);">Shop</span></span>
                <span class="text-[10px] font-extrabold uppercase px-1.5 py-0.5 rounded" style="background: var(--color-primary-light); color: var(--color-primary-text);">PCJIC</span>
            </div>
        </a>

        <!-- Derecha -->
        <div class="flex items-center gap-3">

            <!-- Conmutador Catalogo / Mi Emprendimiento -->
            <div class="hidden sm:flex items-center p-1 rounded-xl text-xs font-semibold ps-tab-bar w-max">
                <a th:href="@{/}"
                   th:classappend="${paginaActual == 'catalogo'} ? 'active' : ''"
                   class="ps-tab px-3 py-1.5 cursor-pointer">
                    Ver Catalogo
                </a>
                <a th:href="@{/panel}"
                   th:classappend="${paginaActual == 'panel'} ? 'active' : ''"
                   class="ps-tab px-3 py-1.5 cursor-pointer whitespace-nowrap">
                    Mi Emprendimiento
                </a>
            </div>

            <!-- Toggle de tema -->
            <button id="theme-toggle"
                    class="theme-toggle"
                    type="button"
                    title="Cambiar tema">
                <svg class="icon-sun" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                </svg>
                <svg class="icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
            </button>

            <!-- Boton sesion -->
            <div th:if="${#authentication != null and #authentication.isAuthenticated() and #authentication.name != 'anonymousUser'}">
                <form th:action="@{/auth/logout}" method="post" class="inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="ps-btn-secondary inline-flex items-center gap-2 text-xs sm:text-sm cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                        <span class="font-medium">Cerrar sesion</span>
                    </button>
                </form>
            </div>

            <div th:unless="${#authentication != null and #authentication.isAuthenticated() and #authentication.name != 'anonymousUser'}">
                <a th:href="@{/auth/login}" class="ps-btn-secondary inline-flex items-center gap-2 text-xs sm:text-sm cursor-pointer">
                    <svg class="w-4 h-4" style="color: var(--color-text-muted);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                    </svg>
                    <span class="font-medium">Acceso Emprendedor</span>
                </a>
            </div>

        </div>
    </div>
</header>

<!-- ============================================================ -->
<!-- FRAGMENTO: BOTTOM NAV MOVIL                                 -->
<!-- ============================================================ -->
<nav th:fragment="bottomNav" class="md:hidden fixed bottom-0 left-0 right-0 z-40 ps-navbar shadow-lg">
    <div class="grid grid-cols-3 h-14">

        <a th:href="@{/}"
           th:classappend="${paginaActual == 'catalogo'} ? 'font-semibold' : ''"
           th:style="${paginaActual == 'catalogo'} ? 'color: var(--color-primary);' : 'color: var(--color-text-muted);'"
           class="flex flex-col items-center justify-center gap-1 cursor-pointer transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
            </svg>
            <span class="text-[10px] tracking-tight">Catalogo</span>
        </a>

        <a th:href="@{/panel}"
           th:classappend="${paginaActual == 'panel'} ? 'font-semibold' : ''"
           th:style="${paginaActual == 'panel'} ? 'color: var(--color-primary);' : 'color: var(--color-text-muted);'"
           class="flex flex-col items-center justify-center gap-1 cursor-pointer transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <span class="text-[10px] tracking-tight">Mi Panel</span>
        </a>

        <a th:href="${#authentication != null and #authentication.isAuthenticated() and #authentication.name != 'anonymousUser'} ? '/panel' : '/auth/login'"
           th:classappend="${paginaActual == 'cuenta'} ? 'font-semibold' : ''"
           th:style="${paginaActual == 'cuenta'} ? 'color: var(--color-primary);' : 'color: var(--color-text-muted);'"
           class="flex flex-col items-center justify-center gap-1 cursor-pointer transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <span class="text-[10px] tracking-tight">Cuenta</span>
        </a>

    </div>
</nav>

<!-- ============================================================ -->
<!-- FRAGMENTO: TOAST NOTIFICATION                               -->
<!-- ============================================================ -->
<div th:fragment="toast"
     id="app-toast"
     class="hidden fixed top-10 inset-x-0 mx-auto w-max z-50 flex items-center gap-3 px-5 py-3 rounded-xl shadow-lg border text-sm font-medium"
     style="background: var(--color-surface-solid); color: var(--color-text); border-color: var(--color-border);">
    <svg id="toast-icon" class="w-4 h-4" style="color: var(--color-primary);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
    </svg>
    <span id="toast-message">Notificacion</span>
</div>

<!-- Fragmento: scripts -->
<th:block th:fragment="scripts">
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
