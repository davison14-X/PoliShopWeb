<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      class="h-full bg-slate-50">
<head th:fragment="head(titulo, descripcion)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título dinámico por página -->
    <title th:text="${titulo} + ' — PoliShop PCJIC'">PoliShop — Marketplace Comunidad PCJIC</title>

    <!-- Meta descripción dinámica (para SEO y OpenGraph) -->
    <meta name="description" th:content="${descripcion}?: 'Plataforma de emprendimientos y comercio de la comunidad del Politécnico Colombiano Jaime Isaza Cadavid.'" />

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
              colors: {
                emerald: {
                  50:'#ecfdf5', 100:'#d1fae5', 200:'#a7f3d0', 300:'#6ee7b7',
                  400:'#34d399', 500:'#10b981', 600:'#059669', 700:'#047857',
                  800:'#065f46', 900:'#064e3b', 950:'#022c22'
                },
                slate: {
                  50:'#f8fafc', 100:'#f1f5f9', 200:'#e2e8f0', 300:'#cbd5e1',
                  400:'#94a3b8', 500:'#64748b', 600:'#475569', 700:'#334155',
                  800:'#1e293b', 900:'#0f172a', 950:'#020617'
                }
              }
            }
          }
        }
    </script>

    <!-- Estilos complementarios -->
    <link rel="stylesheet" th:href="@{/css/styles.css}" />

    <!-- CSRF para peticiones AJAX -->
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>

    <!-- Bloque extra para meta OG (lo usan producto.html y detalle.html) -->
    <th:block th:replace="${extraHead} ?: ~{}" />
</head>

<body class="min-h-full flex flex-col text-slate-900 bg-slate-50 antialiased selection:bg-emerald-100 selection:text-emerald-900">

<!-- ============================================================ -->
<!-- FRAGMENTO: NAVBAR                                            -->
<!-- Uso: <div th:replace="~{layout/base :: navbar}"></div>       -->
<!-- ============================================================ -->
<header th:fragment="navbar" class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">

        <!-- Logo -->
        <a th:href="@{/}" class="flex items-center gap-2.5 group cursor-pointer">
            <div class="w-9 h-9 rounded-xl bg-emerald-700 text-white flex items-center justify-center shadow-sm group-hover:bg-emerald-800 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                </svg>
            </div>
            <div class="flex items-baseline gap-1.5">
                <span class="text-xl font-black tracking-tight text-slate-900">Poli<span class="text-emerald-700">Shop</span></span>
                <span class="text-[10px] font-extrabold uppercase px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 tracking-wider">PCJIC</span>
            </div>
        </a>

        <!-- Derecha -->
        <div class="flex items-center gap-3">

            <!-- Conmutador Catálogo / Mi Emprendimiento -->
            <div class="hidden sm:flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200/80 text-xs font-semibold">
                <a th:href="@{/}"
                   th:classappend="${paginaActual == 'catalogo'} ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'"
                   class="px-3 py-1.5 rounded-lg transition-all cursor-pointer">
                    Ver Catálogo
                </a>
                <a th:href="@{/panel}"
                   th:classappend="${paginaActual == 'panel'} ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'"
                   class="px-3 py-1.5 rounded-lg transition-all cursor-pointer">
                    Mi Emprendimiento
                </a>
            </div>

            <!-- Botón: si está logueado muestra su nombre, si no muestra "Acceso Emprendedor" -->
            <div th:if="${#authentication != null and #authentication.isAuthenticated() and #authentication.name != 'anonymousUser'}">
                <form th:action="@{/auth/logout}" method="post" class="inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit"
                            class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium border border-slate-300 hover:border-red-300 bg-white hover:bg-red-50 text-slate-800 hover:text-red-700 transition-all shadow-sm cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                        <span class="font-medium">Cerrar sesión</span>
                    </button>
                </form>
            </div>

            <div th:unless="${#authentication != null and #authentication.isAuthenticated() and #authentication.name != 'anonymousUser'}">
                <a th:href="@{/auth/login}"
                   class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium border border-slate-300 hover:border-slate-400 bg-white hover:bg-slate-50 text-slate-800 transition-all shadow-sm cursor-pointer">
                    <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                    </svg>
                    <span class="font-medium">Acceso Emprendedor</span>
                </a>
            </div>

        </div>
    </div>
</header>

<!-- ============================================================ -->
<!-- FRAGMENTO: BOTTOM NAV MÓVIL                                 -->
<!-- Uso: <div th:replace="~{layout/base :: bottomNav}"></div>    -->
<!-- ============================================================ -->
<nav th:fragment="bottomNav" class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 pb-safe shadow-lg">
    <div class="grid grid-cols-3 h-14">

        <!-- Catálogo -->
        <a th:href="@{/}"
           th:classappend="${paginaActual == 'catalogo'} ? 'text-emerald-700 font-semibold' : 'text-slate-500'"
           class="flex flex-col items-center justify-center gap-1 cursor-pointer transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
            </svg>
            <span class="text-[10px] tracking-tight">Catálogo</span>
        </a>

        <!-- Mi Panel -->
        <a th:href="@{/panel}"
           th:classappend="${paginaActual == 'panel'} ? 'text-emerald-700 font-semibold' : 'text-slate-500'"
           class="flex flex-col items-center justify-center gap-1 cursor-pointer transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <span class="text-[10px] tracking-tight">Mi Panel</span>
        </a>

        <!-- Cuenta -->
        <a th:href="${#authentication != null and #authentication.isAuthenticated() and #authentication.name != 'anonymousUser'} ? '/panel' : '/auth/login'"
           th:classappend="${paginaActual == 'cuenta'} ? 'text-emerald-700 font-semibold' : 'text-slate-500'"
           class="flex flex-col items-center justify-center gap-1 cursor-pointer transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <span class="text-[10px] tracking-tight">Cuenta</span>
        </a>

    </div>
</nav>

<!-- ============================================================ -->
<!-- FRAGMENTO: TOAST NOTIFICATION                               -->
<!-- Uso: <div th:replace="~{layout/base :: toast}"></div>        -->
<!-- ============================================================ -->
<div th:fragment="toast"
     id="app-toast"
     class="hidden fixed top-5 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 px-5 py-3 rounded-xl shadow-lg border text-sm font-medium bg-slate-900 text-white border-slate-700">
    <svg id="toast-icon" class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
    </svg>
    <span id="toast-message">Notificación</span>
</div>

<!-- Fragmento: scripts (incluir al final del body de cada página) -->
<th:block th:fragment="scripts">
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
