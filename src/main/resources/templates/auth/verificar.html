<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      class="h-full">

<head th:replace="~{layout/base :: head('Verificar correo', 'Ingresa el código que enviamos a tu correo institucional.')}"></head>

<body class="min-h-full flex flex-col antialiased page-with-bg" style="background-color: var(--color-bg); color: var(--color-text);">

<div th:replace="~{layout/base :: navbar}"></div>

<main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="ps-surface w-full max-w-md rounded-2xl shadow-2xl overflow-hidden animate-fade-in-up">

        <!-- Header -->
        <div class="p-5 flex items-center gap-3" style="border-bottom: 1px solid var(--color-border);">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0" style="background: var(--color-primary-light); color: var(--color-primary);">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
            </div>
            <div>
                <h1 class="text-base font-bold" style="color: var(--color-text);">Verifica tu correo institucional</h1>
                <p class="text-xs" style="color: var(--color-text-muted);">Ingresa el código de 6 dígitos que enviamos a tu correo</p>
            </div>
        </div>

        <!-- Cuerpo -->
        <div class="p-5 space-y-5">

            <!-- Info del correo al que se envió -->
            <div class="p-3.5 rounded-xl flex items-center gap-3 text-sm" style="background: var(--color-input-bg); border: 1px solid var(--color-border);">
                <svg class="w-4 h-4 shrink-0" style="color: var(--color-primary);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span style="color: var(--color-text-secondary);">
            Código enviado a
            <span class="font-semibold" style="color: var(--color-text);" th:text="${correo}">usuario@elpoli.edu.co</span>
          </span>
            </div>

            <!-- Error de verificación -->
            <div th:if="${error}"
                 class="p-2.5 rounded-xl flex items-start gap-2 text-xs" style="background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); color: #ef4444;">
                <svg class="w-4 h-4 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                <span th:text="${error}">Código incorrecto o expirado.</span>
            </div>

            <!-- Formulario del código -->
            <form th:action="@{/auth/verificar}" method="post" class="space-y-4">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div>
                    <label for="codigo"
                           class="block text-xs font-semibold uppercase tracking-wider mb-1" style="color: var(--color-text-secondary);">
                        Código de verificación
                    </label>
                    <input
                            type="text"
                            id="codigo"
                            name="codigo"
                            required
                            maxlength="6"
                            placeholder="123456"
                            autocomplete="one-time-code"
                            inputmode="numeric"
                            class="ps-input text-2xl font-bold tracking-[0.5em] text-center"
                    />
                    <p class="text-[11px] mt-1.5 text-center" style="color: var(--color-text-muted);">
                        El código vence en 15 minutos · Tienes máximo 3 intentos
                    </p>
                </div>

                <button
                        type="submit"
                        class="w-full ps-btn-primary cursor-pointer">
                    Verificar y acceder al panel
                </button>

            </form>

            <!-- Reenviar código -->
            <div class="pt-2 text-center" style="border-top: 1px solid var(--color-border);">
                <p class="text-xs mb-2" style="color: var(--color-text-muted);">¿No recibiste el código o ya expiró?</p>
                <form th:action="@{/auth/reenviar-codigo}" method="post" class="inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button
                            type="submit"
                            class="text-xs font-semibold hover:underline cursor-pointer transition-colors" style="color: var(--color-primary);">
                        Reenviar código
                    </button>
                </form>
            </div>

        </div>
    </div>
</main>

<div th:replace="~{layout/base :: toast}"></div>
<div th:replace="~{layout/base :: bottomNav}"></div>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
